[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rampart-examples"
version = "0.0.0"
description = "Runnable RAMPART showcases. Each subdirectory is the actual installable unit; this top-level project exists only for shared tooling configuration."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -n auto -p no:rampart"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.codespell]
# "te" is a real HTTP hop-by-hop header name (RFC 7230) referenced in
# openclaw/src/openclaw/auth/server.py.
ignore-words-list = "te"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Two pairs of mutually-exclusive pydocstyle rules; pick one of each.
    "D203",  # incompatible with D211 (no-blank-line-before-class)
    "D213",  # incompatible with D212 (multi-line-summary-first-line)
    # Conflicts with the formatter; ``ruff format`` owns line wrapping
    # and intentionally leaves a few long strings/URLs alone.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "INP001",
    "S101",
    "TRY003",
    "EM101",
    "FBT001",
    "SLF001",
]
"**/conftest.py" = ["INP001"]
# The OpenClaw example is sandbox glue + HTML report templates. Several
# strict library-grade rules add no value here (docstring density on
# trivial accessors, magic constants in demo asserts, HTML template
# line length, defensive blind-except in cleanup paths, etc.).
"openclaw/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN401",
    "ARG002",
    "ARG004",
    "ASYNC109",
    "B904",
    "BLE001",
    "C901",
    "D",
    "E402",
    "E501",
    "EM101",
    "EM102",
    "EXE005",
    "INP001",
    "N806",
    "PLR0913",
    "PLR2004",
    "PLW2901",
    "PTH103",
    "PTH111",
    "PTH120",
    "PTH123",
    "PYI034",
    "PYI036",
    "RUF001",
    "RUF002",
    "S310",
    "SIM115",
    "TRY003",
    "TRY300",
    "TRY401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"
extra-paths = ["helpdesk-bot", "openclaw/src"]

[tool.ty.src]
include = ["helpdesk-bot", "openclaw", "tests"]

[tool.uv.workspace]
members = ["helpdesk-bot", "openclaw"]

[tool.uv.sources]
helpdesk-bot = { workspace = true }
rampart-openclaw = { workspace = true }

[dependency-groups]
dev = [
    "helpdesk-bot",
    "rampart-openclaw",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
