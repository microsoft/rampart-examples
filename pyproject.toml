[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rampart-examples"
version = "0.0.0"
description = "Runnable RAMPART showcases. Each subdirectory is the actual installable unit; this top-level project exists only for shared tooling configuration."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -n auto -p no:rampart"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "INP001",
    "S101",
    "TRY003",
    "EM101",
    "FBT001",
    "SLF001",
    "D",        # docstrings inside test bodies are noise
    "PLR2004",  # status codes / counts as bare ints are fine in tests
    "ARG001",   # pytest fixtures arrive as unused-looking parameters
]
"**/conftest.py" = [
    "INP001",
    "D"
]
"**/__init__.py" = ["D104"]
# Pydantic models + FastAPI route handlers introspect annotations at
# runtime (model rebuild, get_type_hints), so type imports MUST stay
# at module top level even with ``from __future__ import annotations``.
"helpdesk-agent/helpdesk-ui/helpdesk_ui/schemas.py" = ["TC003"]
"helpdesk-agent/helpdesk-ui/helpdesk_ui/routes/*.py" = ["TC001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"
extra-paths = ["helpdesk-agent", "helpdesk-agent/helpdesk-ui"]

[tool.ty.src]
include = ["helpdesk-agent", "tests"]

[tool.uv.workspace]
members = ["helpdesk-agent", "helpdesk-agent/helpdesk-ui"]

[tool.uv.sources]
helpdesk-agent = { workspace = true }
helpdesk-ui = { workspace = true }

[dependency-groups]
dev = [
    "helpdesk-agent",
    "helpdesk-ui",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
