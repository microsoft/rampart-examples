[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rampart-examples"
version = "0.0.0"
description = "Runnable RAMPART showcases. Each subdirectory is the actual installable unit; this top-level project exists only for shared tooling configuration."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -n auto -p no:rampart"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Two pairs of mutually-exclusive pydocstyle rules; pick one of each.
    "D203",  # incompatible with D211 (no-blank-line-before-class)
    "D213",  # incompatible with D212 (multi-line-summary-first-line)
    # Conflicts with the formatter; ``ruff format`` owns line wrapping
    # and intentionally leaves a few long strings/URLs alone.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "INP001",
    "S101",
    "TRY003",
    "EM101",
    "FBT001",
    "SLF001",
]
"**/conftest.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"
extra-paths = ["helpdesk-agent"]

[tool.ty.src]
include = ["helpdesk-agent", "tests"]

[tool.uv.workspace]
members = ["helpdesk-agent"]

[tool.uv.sources]
helpdesk-agent = { workspace = true }

[dependency-groups]
dev = [
    "helpdesk-agent",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
