[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Top-level project for shared tooling config and the uv workspace.
# Each demo subdirectory has its own pyproject.toml and is the unit of
# install; this project is not pip-installable on its own.

[project]
name = "rampart-examples"
version = "0.0.0"
description = "Runnable RAMPART showcases. Each subdirectory is the actual installable unit; this top-level project exists only for shared tooling configuration."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
# Repo-root pytest discovers only the maintainer smoke suite.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -n auto -p no:rampart"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Two pairs of mutually-exclusive pydocstyle rules; pick one of each.
    "D203",  # incompatible with D211 (no-blank-line-before-class)
    "D213",  # incompatible with D212 (multi-line-summary-first-line)
    # Conflicts with the formatter; ``ruff format`` owns line wrapping
    # and intentionally leaves a few long strings/URLs alone.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# Pytest test modules (collection roots) and pytest's own conftest.py
# do not have ``__init__.py`` by convention; pytest discovers them by path.
"**/test_*.py" = [
    "INP001",                                  # not a package; pytest collects by path
    "S101",                                    # asserts are pytest's API
    "D100", "D101", "D102", "D104", "D107",    # test names describe; no docstrings needed
    "ANN001", "ANN201", "ANN202", "ANN401",    # type annotations on test bodies are noise
    "PLR2004",                                 # magic values in assertions are the assertion
    "ARG001", "ARG002",                        # unused fixture args (pytest passes by name)
    "TRY003", "EM101", "EM102",                # exception-message style is fine in tests
    "FBT001",                                  # bool positionals improve parametrize readability
    "TC003",                                   # tests reference these symbols at runtime
    "SLF001",                                  # tests legitimately exercise private members
]
"**/conftest.py" = [
    "INP001",
    "S101",
    "D100", "D104",
    "ANN001", "ANN201",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"
extra-paths = ["helpdesk-bot"]

[tool.ty.src]
include = ["helpdesk-bot", "tests"]

[tool.uv.workspace]
members = ["helpdesk-bot"]

[tool.uv.sources]
helpdesk-bot = { workspace = true }

[dependency-groups]
dev = [
    "helpdesk-bot",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
