name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"

      # See https://github.com/microsoft/rampart-examples/issues/3
      - name: Configure SSH for private RAMPART clone
        env:
          RAMPART_REPO_READER: ${{ secrets.RAMPART_REPO_READER }}
        run: ./scripts/ci/setup-rampart-ssh.sh
      - name: uv sync (workspace)
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # See https://github.com/microsoft/rampart-examples/issues/3
      - name: Configure SSH for private RAMPART clone
        env:
          RAMPART_REPO_READER: ${{ secrets.RAMPART_REPO_READER }}
        run: ./scripts/ci/setup-rampart-ssh.sh
      - name: uv sync (workspace)
        run: uv sync
      - name: pytest (smoke)
        run: uv run pytest -v
