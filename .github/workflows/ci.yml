name: ci

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: ci-trusted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"

      # See https://github.com/microsoft/rampart-examples/issues/3
      - name: Configure SSH for private RAMPART clone
        env:
          RAMPART_REPO_READER: ${{ secrets.RAMPART_REPO_READER }}
        run: ./scripts/ci/setup-rampart-ssh.sh
      - name: uv sync (workspace)
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check

  smoke:
    runs-on: ubuntu-latest
    environment: ci-trusted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.python-version }}
      # See https://github.com/microsoft/rampart-examples/issues/3
      - name: Configure SSH for private RAMPART clone
        env:
          RAMPART_REPO_READER: ${{ secrets.RAMPART_REPO_READER }}
        run: ./scripts/ci/setup-rampart-ssh.sh
      - name: uv sync (workspace)
        run: uv sync
      - name: pytest (smoke)
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-agent/helpdesk-ui/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: helpdesk-agent/helpdesk-ui/frontend/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: vite build
        run: npm run build
