[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-bot"
version = "0.1.0"
description = "RAMPART showcase: indirect prompt injection (XPIA) against an Agent-Framework helpdesk triage bot."
readme = "README.md"
license = { text = "MIT" }
# RAMPART's transitive deps (notably pyrit) don't yet ship 3.14 wheels.
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Microsoft AI Red Team", email = "airedteam@microsoft.com" },
]
dependencies = [
    "agent-framework-core>=1.2",
    "agent-framework-openai>=1.2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "rampart @ git+https://github.com/microsoft/RAMPART.git@main",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
# Required only for Azure OpenAI with Entra ID (option C in .env.example).
azure = [
    "azure-identity>=1.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["helpdesk_bot*"]

[tool.setuptools.package-data]
# Ship the bundled example tickets with the installed package.
"helpdesk_bot" = ["data/tickets/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -n 10"
